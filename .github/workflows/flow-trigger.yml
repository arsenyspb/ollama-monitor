# Generated by atobar-flow. Do not edit; change tenants/arsenyspb__ollama-monitor.json in atobar-flow instead.
name: flow Trigger

on:
  issues:
    types: [labeled, edited]
  pull_request:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]
  "check_run":
    types: [completed]

jobs:
  forward:
    if: >-
      (github.event_name == 'issues' &&
       ((github.event.action == 'labeled' &&
         (github.event.label.name == 'flow:feature' ||
          github.event.label.name == 'flow:fix' ||
          github.event.label.name == 'flow:docs')) ||
        (github.event.action == 'edited' &&
         contains(github.event.issue.labels.*.name, 'flow:onboard')))) ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '```flow-')) ||
      (github.event_name == 'check_run')
    runs-on: ubuntu-latest
    steps:
      - name: Forward to atobar-flow Control Panel
        env:
          ATOBAR_TENANT_TOKEN: ${{ secrets.ATOBAR_TENANT_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          SENDER: ${{ github.event.sender.login }}
          LABEL: ${{ github.event.label.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.check_run.head_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          CHECK_NAME: ${{ github.event.check_run.name }}
          CONCLUSION: ${{ github.event.check_run.conclusion }}
          RUN_ID: ${{ github.event.check_run.id }}
        run: |
          # shellcheck disable=SC2153
          if [ "$EVENT_NAME" = "issues" ]; then
            if [ "$ACTION" = "edited" ]; then
              kind="issues.edited"
              label="flow:onboard"
            else
              kind="issues.labeled"
              label="$LABEL"
            fi
            body=$(jq -nc               --argjson n "$ISSUE_NUMBER"               --arg l "$label"               --arg k "$kind"               --arg s "$SENDER"               '{"kind":$k,"issue_number":$n,"label":$l,"sender":$s}')
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            kind="pull_request.$ACTION"
            is_merged=false
            if [ "$MERGED" = "true" ]; then
              is_merged=true
            fi
            body=$(jq -nc               --argjson n "$PR_NUMBER"               --arg h "$HEAD_SHA"               --arg b "$BASE_SHA"               --arg k "$kind"               --arg s "$SENDER"               --argjson m "$is_merged"               '{"kind":$k,"pr_number":$n,"head_sha":$h,"base_sha":$b,"sender":$s,"merged":$m}')
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            kind="issue_comment.created"
            body=$(jq -nc               --argjson n "$ISSUE_NUMBER"               --arg b "$COMMENT_BODY"               --argjson id "$COMMENT_ID"               --arg k "$kind"               --arg s "$SENDER"               '{"kind":$k,"issue_number":$n,"comment_body":$b,"comment_id":$id,"sender":$s}')
          elif [ "$EVENT_NAME" = "check_run" ]; then
            kind="check_run.completed"
            body=$(jq -nc               --arg n "$CHECK_NAME"               --arg c "$CONCLUSION"               --arg h "$HEAD_SHA"               --argjson r "$RUN_ID"               --arg k "$kind"               '{"kind":$k,"check_name":$n,"conclusion":$c,"head_sha":$h,"run_id":$r}')
          else
            echo "Ignoring unhandled event: $EVENT_NAME"
            exit 0
          fi
          curl -sSf -X POST https://cp.karar.asia/v1/events \
            -H "Authorization: Bearer $ATOBAR_TENANT_TOKEN" -H "Content-Type: application/json" -d "$body"
