name: flow Trigger

on:
  issues:
    types: [labeled]

jobs:
  forward:
    # Only the repository owner may start the harness. The labeler is github.event.sender.
    if: startsWith(github.event.label.name, 'flow:') && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Forward to central orchestrator
        env:
          DISPATCH_TOKEN: ${{ secrets.FLOW_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          ISSUE_ID: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo "$TARGET_REPO" \
            --argjson issue "$ISSUE_ID" \
            --arg label "$LABEL_NAME" \
            '{"event_type": "flow_run", "client_payload": {"target_repo": $repo, "issue_id": $issue, "label": $label}}')
          curl -sf -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/arsenyspb/atobar-flow/dispatches \
            -d "$PAYLOAD"
