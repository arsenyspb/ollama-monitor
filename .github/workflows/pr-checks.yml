name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [ "main" ]

jobs:
  ai-attribution:
    runs-on: ubuntu-latest
    steps:
      - name: Require AI-assisted field
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          value=$(printf '%s\n' "$BODY" | sed -n 's/^AI-assisted:[[:space:]]*\([a-z]*\).*/\1/p' | head -n1)
          case "$value" in
            yes|no) echo "AI-assisted: $value" ;;
            *) echo "::error::PR body must contain 'AI-assisted: yes' or 'AI-assisted: no' (see the PR template)."; exit 1 ;;
          esac
          echo "AI_ASSISTED=$value" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Co-Authored-By trailer when AI-assisted
        run: |
          if [ "$AI_ASSISTED" != "yes" ]; then
            echo "Not AI-assisted; trailer not required."
            exit 0
          fi
          commits=$(git rev-list "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}")
          found=0
          for c in $commits; do
            if git log -1 --format=%B "$c" | grep -qi '^Co-Authored-By:'; then
              found=1
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::AI-assisted is yes, but no commit in this PR has a Co-Authored-By trailer (see AGENTS.md section 6)."
            exit 1
          fi
          echo "Co-Authored-By trailer found."
