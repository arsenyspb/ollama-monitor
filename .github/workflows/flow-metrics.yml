# Generated by atobar-flow. Do not edit; change tenants/arsenyspb__ollama-monitor.json in atobar-flow instead.
name: flow-metrics

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flow-metrics:
    runs-on: ubuntu-latest
    env:
      ATOBAR_TENANT_TOKEN: ${{ secrets.ATOBAR_TENANT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Setup
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: "metric: e2e_install_time_seconds"
        id: e2e_install_time_seconds
        run: |
          v=$(bash -c 'start=$(date +%s); pip install -e . -q; end=$(date +%s); echo $((end-start))' | tail -n1)
          python -c "import math,sys; x=float(sys.argv[1]); assert math.isfinite(x)" "$v"
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: "metric: dependency_count"
        id: dependency_count
        run: |
          v=$(pip freeze | wc -l | awk '{print $1}' | tail -n1)
          python -c "import math,sys; x=float(sys.argv[1]); assert math.isfinite(x)" "$v"
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Assemble flow-metrics.json
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os
          doc = {
              "commit_sha": os.environ["COMMIT_SHA"],
              "pr_number": int(os.environ["PR_NUMBER"]) if os.environ.get("PR_NUMBER") else None,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "workflow_path": ".github/workflows/flow-metrics.yml",
              "values": {"e2e_install_time_seconds": float("${{ steps.e2e_install_time_seconds.outputs.value }}"), "dependency_count": float("${{ steps.dependency_count.outputs.value }}")},
          }
          open("flow-metrics.json", "w").write(json.dumps(doc, sort_keys=True))
          print(json.dumps(doc, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flow-metrics
          path: flow-metrics.json
      - name: Report to atobar-flow Control Panel
        if: ${{ env.ATOBAR_TENANT_TOKEN != '' }}
        run: |
          curl -sSf -X POST https://cp.karar.asia/v1/metrics \
            -H "Authorization: Bearer $ATOBAR_TENANT_TOKEN" -H "Content-Type: application/json" \
            --data-binary @flow-metrics.json
