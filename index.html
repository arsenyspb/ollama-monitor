<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      width: 200px;
      height: 100px;
      overflow: hidden;
      background: #f0f0f0;
      padding: 10px;
    }
    .box {
      width: 100%;
      height: 50px;
      background: red;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">This box overflows the container!</div>
  </div>
</body>
</html>
